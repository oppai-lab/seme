[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seme"
version = "0.1.0"
description = "A small, opinionated Python project scaffold."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Pietro Fecchio" }]
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4.3,<5",
    "pytest>=9.0.3,<10",
    "pytest-cov>=6.2,<8",
    "ruff>=0.12,<0.13",
    "ty>=0.0.1a16,<0.1",
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src/seme"]

[tool.ruff]
line-length = 100
extend-exclude = [".direnv"]

[tool.ruff.lint]
select = [
    "A",     # flake8-builtins
    "ARG",   # flake8-unused-arguments
    "ASYNC", # flake8-async
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "E",     # pycodestyle errors
    "F",     # Pyflakes
    "FA",    # flake8-future-annotations
    "FBT",   # flake8-boolean-trap
    "I",     # isort
    "ISC",   # flake8-implicit-str-concat
    "LOG",   # flake8-logging
    "N",     # pep8-naming
    "PERF",  # Perflint
    "PIE",   # flake8-pie
    "PL",    # Pylint
    "PT",    # flake8-pytest-style
    "PTH",   # flake8-use-pathlib
    "RET",   # flake8-return
    "RSE",   # flake8-raise
    "RUF",   # Ruff-specific rules
    "S",     # flake8-bandit
    "SIM",   # flake8-simplify
    "T20",   # flake8-print
    "TC",    # flake8-type-checking
    "TRY",   # tryceratops
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
]
ignore = [
    "ISC001", # Conflicts with the formatter.
    "TRY003", # Inline exception messages are clearer for simple validation errors.
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ARG",
    "PLR2004",
    "S101",
]

[tool.ruff.lint.isort]
known-first-party = ["seme"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
]
testpaths = ["tests"]
xfail_strict = true
markers = [
    "slow: takes long enough that it should be skippable with -m 'not slow'",
]

[tool.coverage.run]
branch = true
source = ["seme"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ty.environment]
python-version = "3.12"
root = ["src"]

[tool.ty.rules]
all = "error"
